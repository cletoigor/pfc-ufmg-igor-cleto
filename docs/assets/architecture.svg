<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2100 1120" role="img"
     aria-label="Swimlane diagram of the IoT pipeline in five lanes, read strictly left to right: Tuya Cloud API and device_mapping.json, then the Dagster assets raw_tuya_logs and staging_tuya_logs and the two gold assets, each writing its own dataset in the storage lane, then load_metrics and the access modules, cusum.py and the agent, then server.py, and finally the Streamlit dashboard, the web app and the SSE agent panel. A separate red control bus carries server.py, scenes/executor.py and the agent to send_device_command and out to Tuya, passing three dry-run gates.">
  <style>
    text { font-family: -apple-system, "Archivo", "Source Serif 4", "JetBrains Mono", Georgia, monospace, sans-serif; }
  </style>

  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5D6862"/>
    </marker>
    <marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#A8351F"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="2100" height="1120" fill="#F1F3EF"/>

  <g>
    <line x1="24" y1="30" x2="56" y2="30" stroke="#5D6862" stroke-width="1.6" marker-end="url(#ah)"/>
    <text x="66" y="34" font-family="Archivo, sans-serif" font-size="11.5" fill="#171B18">control / data flow</text>
    <line x1="200" y1="30" x2="232" y2="30" stroke="#5D6862" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/>
    <text x="242" y="34" font-family="Archivo, sans-serif" font-size="11.5" fill="#171B18">reads (read-only)</text>
    <ellipse cx="378" cy="26" rx="15" ry="5" fill="#F4EBDA" stroke="#9A6716" stroke-width="1.4"/>
    <path d="M 363 26 V 33 A 15 5 0 0 0 393 33 V 26" fill="#F4EBDA" stroke="#9A6716" stroke-width="1.4"/>
    <text x="402" y="34" font-family="Archivo, sans-serif" font-size="11.5" fill="#171B18">stored dataset</text>
    <line x1="536" y1="30" x2="568" y2="30" stroke="#A8351F" stroke-width="2" marker-end="url(#ahr)"/>
    <text x="578" y="34" font-family="Archivo, sans-serif" font-size="11.5" fill="#171B18">gated write path — the only route to a physical device</text>
  </g>
  <rect x="0" y="60" width="2100" height="112" fill="#E9EDE8"/>
  <rect x="0" y="172" width="2100" height="200" fill="#E4EFEF"/>
  <rect x="0" y="372" width="2100" height="164" fill="#F2EBDD"/>
  <rect x="0" y="536" width="2100" height="380" fill="#E7EDE7"/>
  <rect x="0" y="916" width="2100" height="144" fill="#E5EAF2"/>
  <g stroke="#C3CBC2" stroke-width="1">
    <line x1="0" y1="60" x2="2100" y2="60"/>
    <line x1="0" y1="172" x2="2100" y2="172"/>
    <line x1="0" y1="372" x2="2100" y2="372"/>
    <line x1="0" y1="536" x2="2100" y2="536"/>
    <line x1="0" y1="916" x2="2100" y2="916"/>
    <line x1="0" y1="1060" x2="2100" y2="1060"/>
    <line x1="150" y1="60" x2="150" y2="1060"/>
  </g>
  <g font-family="Archivo, sans-serif" font-size="12.5" font-weight="600" fill="#171B18">
    <text x="14" y="112">Devices &amp;</text><text x="14" y="128">Tuya Cloud</text>
    <text x="14" y="276">Dagster</text><text x="14" y="458">Storage</text>
    <text x="14" y="720">API &amp; logic</text><text x="14" y="992">Clients</text>
  </g>
  <g font-family="JetBrains Mono, monospace" font-size="9.5" fill="#5D6862">
    <text x="14" y="144">outside the repo</text><text x="14" y="476">app/data/</text>
    <text x="14" y="738">app/api · app/agent</text><text x="14" y="1008">app/web · Streamlit</text>
  </g>
  <g>
    <rect x="12" y="300" width="126" height="20" rx="2" fill="#FDFDFB" stroke="#0F7B80" stroke-width="1.2"/>
    <text x="20" y="314" font-family="JetBrains Mono, monospace" font-size="9.5" fill="#0F7B80">0 * * * *  assets</text>
    <rect x="12" y="324" width="126" height="20" rx="2" fill="#FDFDFB" stroke="#A8351F" stroke-width="1.2"/>
    <text x="20" y="338" font-family="JetBrains Mono, monospace" font-size="9.5" fill="#A8351F">* * * * *  scenes</text>
    <text x="12" y="358" font-family="Source Serif 4, serif" font-size="9.5" fill="#5D6862">2nd needs the daemon</text>
  </g>
  <rect x="220" y="98" width="150" height="60" rx="2" fill="#FDFDFB" stroke="#C3CBC2" stroke-width="1.4"/>
  <text x="230" y="118" font-family="Archivo, sans-serif" font-size="12" font-weight="700" fill="#171B18">Tuya Cloud API</text>
  <text x="230" y="133" font-family="Source Serif 4, serif" font-size="9.5" fill="#5D6862">status logs, per</text>
  <text x="230" y="146" font-family="JetBrains Mono, monospace" font-size="9.5" fill="#5D6862">device_id</text>
  <rect x="1680" y="98" width="160" height="60" rx="2" fill="#F6E6E1" stroke="#A8351F" stroke-width="1.6"/>
  <text x="1690" y="118" font-family="JetBrains Mono, monospace" font-size="10" font-weight="700" fill="#171B18">send_device_command</text>
  <text x="1690" y="133" font-family="Archivo, sans-serif" font-size="9" fill="#A8351F">GATE 3 · FAILS CLOSED</text>
  <text x="1690" y="146" font-family="Source Serif 4, serif" font-size="9.5" fill="#5D6862">no credentials → refuses</text>
  <rect x="1880" y="98" width="140" height="60" rx="2" fill="#FDFDFB" stroke="#A8351F" stroke-width="1.6"/>
  <text x="1890" y="118" font-family="Archivo, sans-serif" font-size="12" font-weight="700" fill="#171B18">Tuya Cloud</text>
  <text x="1890" y="133" font-family="Archivo, sans-serif" font-size="12" fill="#171B18">commands</text>
  <text x="1890" y="146" font-family="Source Serif 4, serif" font-size="9.5" fill="#5D6862">the relay closes</text>
  <rect x="220" y="218" width="140" height="55" rx="2" fill="#E2EFEE" stroke="#0F7B80" stroke-width="1.4"/>
  <text x="230" y="238" font-family="JetBrains Mono, monospace" font-size="10.5" font-weight="700" fill="#171B18">raw_tuya_logs</text>
  <text x="230" y="253" font-family="Source Serif 4, serif" font-size="9.5" fill="#5D6862">fails loudly on</text>
  <text x="230" y="266" font-family="Source Serif 4, serif" font-size="9.5" fill="#5D6862">zero files saved</text>
  <rect x="450" y="218" width="140" height="55" rx="2" fill="#E2EFEE" stroke="#0F7B80" stroke-width="1.4"/>
  <text x="460" y="238" font-family="JetBrains Mono, monospace" font-size="10" font-weight="700" fill="#171B18">staging_tuya_logs</text>
  <text x="460" y="253" font-family="Source Serif 4, serif" font-size="9.5" fill="#5D6862">flatten via DuckDB;</text>
  <text x="460" y="266" font-family="Source Serif 4, serif" font-size="9.5" fill="#5D6862">time kept in UTC</text>
  <rect x="650" y="186" width="150" height="55" rx="2" fill="#F4EBDA" stroke="#9A6716" stroke-width="1.4"/>
  <text x="660" y="206" font-family="JetBrains Mono, monospace" font-size="10" font-weight="700" fill="#171B18">gold_device_metrics</text>
  <text x="660" y="221" font-family="Source Serif 4, serif" font-size="9.5" fill="#5D6862">when was it on —</text>
  <text x="660" y="234" font-family="Source Serif 4, serif" font-size="9.5" fill="#5D6862">4 tables, local time</text>
  <rect x="650" y="249" width="150" height="55" rx="2" fill="#F4EBDA" stroke="#9A6716" stroke-width="1.4"/>
  <text x="660" y="269" font-family="JetBrains Mono, monospace" font-size="10" font-weight="700" fill="#171B18">gold_energy_metrics</text>
  <text x="660" y="284" font-family="Source Serif 4, serif" font-size="9.5" fill="#5D6862">how much did it draw —</text>
  <text x="660" y="297" font-family="Source Serif 4, serif" font-size="9.5" fill="#5D6862">kWh + CUSUM baseline</text>
  <rect x="1420" y="198" width="150" height="60" rx="2" fill="#FDFDFB" stroke="#A8351F" stroke-width="1.4"/>
  <text x="1430" y="218" font-family="JetBrains Mono, monospace" font-size="10" font-weight="700" fill="#171B18">scene_scheduler_job</text>
  <text x="1430" y="233" font-family="Source Serif 4, serif" font-size="9.5" fill="#5D6862">polls scheduled_scenes</text>
  <text x="1430" y="246" font-family="Source Serif 4, serif" font-size="9.5" fill="#5D6862">.json for anything due</text>
  <rect x="170" y="478" width="150" height="54" rx="2" fill="#FDFDFB" stroke="#C3CBC2" stroke-width="1.4" stroke-dasharray="5 3"/>
  <text x="180" y="498" font-family="JetBrains Mono, monospace" font-size="9.5" font-weight="700" fill="#171B18">device_mapping</text>
  <text x="180" y="513" font-family="JetBrains Mono, monospace" font-size="9.5" fill="#5D6862">.json</text>
  <text x="180" y="526" font-family="Source Serif 4, serif" font-size="9.5" fill="#5D6862">id → name registry</text>
  <ellipse cx="290.0" cy="460" rx="70.0" ry="8" fill="#FDFDFB" stroke="#9A6716" stroke-width="1.4"/>
  <rect x="220" y="404" width="140" height="56" fill="#FDFDFB" stroke="none"/>
  <line x1="220" y1="404" x2="220" y2="460" stroke="#9A6716" stroke-width="1.4"/>
  <line x1="360" y1="404" x2="360" y2="460" stroke="#9A6716" stroke-width="1.4"/>
  <ellipse cx="290.0" cy="404" rx="70.0" ry="8" fill="#F4EBDA" stroke="#9A6716" stroke-width="1.4"/>
  <text x="290.0" y="429" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#171B18">app/data/raw/</text>
  <text x="290.0" y="445" text-anchor="middle" font-family="Source Serif 4, serif" font-size="10.5" fill="#5D6862">JSON per device/day</text>
  <ellipse cx="520.0" cy="460" rx="70.0" ry="8" fill="#FDFDFB" stroke="#9A6716" stroke-width="1.4"/>
  <rect x="450" y="404" width="140" height="56" fill="#FDFDFB" stroke="none"/>
  <line x1="450" y1="404" x2="450" y2="460" stroke="#9A6716" stroke-width="1.4"/>
  <line x1="590" y1="404" x2="590" y2="460" stroke="#9A6716" stroke-width="1.4"/>
  <ellipse cx="520.0" cy="404" rx="70.0" ry="8" fill="#F4EBDA" stroke="#9A6716" stroke-width="1.4"/>
  <text x="520.0" y="429" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#171B18">app/data/staging/</text>
  <text x="520.0" y="445" text-anchor="middle" font-family="Source Serif 4, serif" font-size="10.5" fill="#5D6862">Parquet, event_date=…</text>
  <ellipse cx="835.0" cy="460" rx="185.0" ry="8" fill="#FDFDFB" stroke="#9A6716" stroke-width="1.7"/>
  <rect x="650" y="400" width="370" height="60" fill="#FDFDFB" stroke="none"/>
  <line x1="650" y1="400" x2="650" y2="460" stroke="#9A6716" stroke-width="1.7"/>
  <line x1="1020" y1="400" x2="1020" y2="460" stroke="#9A6716" stroke-width="1.7"/>
  <ellipse cx="835.0" cy="400" rx="185.0" ry="8" fill="#F4EBDA" stroke="#9A6716" stroke-width="1.7"/>
  <text x="835.0" y="425" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#171B18">app/data/warehouse.duckdb</text>
  <text x="835.0" y="441" text-anchor="middle" font-family="Source Serif 4, serif" font-size="10.5" fill="#5D6862">7 gold tables · single writer: Dagster</text>
  <rect x="870" y="556" width="130" height="55" rx="2" fill="#E4EDE4" stroke="#3A6446" stroke-width="1.4"/>
  <text x="880" y="576" font-family="JetBrains Mono, monospace" font-size="10.5" font-weight="700" fill="#171B18">load_metrics()</text>
  <text x="880" y="591" font-family="Source Serif 4, serif" font-size="9.5" fill="#5D6862">warehouse→marts→</text>
  <text x="880" y="604" font-family="Source Serif 4, serif" font-size="9.5" fill="#5D6862">staging; never raises</text>
  <rect x="1060" y="556" width="130" height="55" rx="2" fill="#E4EDE4" stroke="#3A6446" stroke-width="1.4"/>
  <text x="1070" y="576" font-family="JetBrains Mono, monospace" font-size="10.5" font-weight="700" fill="#171B18">data_access ·</text>
  <text x="1070" y="591" font-family="JetBrains Mono, monospace" font-size="9.5" fill="#171B18">energy_access</text>
  <text x="1070" y="604" font-family="Source Serif 4, serif" font-size="9.5" fill="#5D6862">builds JSON payloads</text>
  <rect x="1060" y="650" width="130" height="55" rx="2" fill="#E4EDE4" stroke="#3A6446" stroke-width="1.4"/>
  <text x="1070" y="670" font-family="JetBrains Mono, monospace" font-size="10.5" font-weight="700" fill="#171B18">cusum.py</text>
  <text x="1070" y="685" font-family="Source Serif 4, serif" font-size="9.5" fill="#5D6862">K=k·sigma0, H=h·sigma0,</text>
  <text x="1070" y="698" font-family="Source Serif 4, serif" font-size="9.5" fill="#5D6862">per hour-of-day</text>
  <rect x="1060" y="760" width="150" height="58" rx="2" fill="#FDFDFB" stroke="#3A6446" stroke-width="1.4"/>
  <text x="1070" y="780" font-family="JetBrains Mono, monospace" font-size="10.5" font-weight="700" fill="#171B18">app/agent/</text>
  <text x="1070" y="795" font-family="Source Serif 4, serif" font-size="9.5" fill="#5D6862">3 tools, bounded loop,</text>
  <text x="1070" y="808" font-family="Source Serif 4, serif" font-size="9.5" fill="#5D6862">SELECT-only SQL</text>
  <rect x="1240" y="600" width="150" height="75" rx="2" fill="#FDFDFB" stroke="#3A6446" stroke-width="1.7"/>
  <text x="1250" y="620" font-family="JetBrains Mono, monospace" font-size="10" font-weight="700" fill="#171B18">app/api/server.py</text>
  <text x="1250" y="635" font-family="Source Serif 4, serif" font-size="9.5" fill="#5D6862">Starlette · 12 routes</text>
  <text x="1250" y="648" font-family="Source Serif 4, serif" font-size="9.5" fill="#5D6862">port 8000</text>
  <text x="1250" y="661" font-family="JetBrains Mono, monospace" font-size="9.5" fill="#A8351F">_dry_run_from()</text>
  <rect x="1420" y="740" width="150" height="62" rx="2" fill="#F6E6E1" stroke="#A8351F" stroke-width="1.6"/>
  <text x="1430" y="760" font-family="JetBrains Mono, monospace" font-size="10" font-weight="700" fill="#171B18">scenes/executor.py</text>
  <text x="1430" y="775" font-family="Archivo, sans-serif" font-size="9" fill="#A8351F">GATE 2 · UNATTENDED</text>
  <text x="1430" y="788" font-family="JetBrains Mono, monospace" font-size="9.5" fill="#5D6862">DRY_RUN=1 by default</text>
  <rect x="1240" y="536" width="200" height="38" rx="2" fill="#EAE6F3"
        stroke="#55468A" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="1250" y="552" font-family="Archivo, sans-serif" font-size="9" font-weight="600"
        letter-spacing="0.06em" fill="#55468A">GATE 1 · PER REQUEST</text>
  <text x="1250" y="566" font-family="Source Serif 4, serif" font-size="9.5"
        fill="#5D6862">no shipped UI ever sends false</text>
  <rect x="870" y="931" width="180" height="60" rx="2" fill="#FDFDFB" stroke="#C3CBC2" stroke-width="1.4" stroke-dasharray="5 3"/>
  <text x="880" y="951" font-family="JetBrains Mono, monospace" font-size="10" font-weight="700" fill="#171B18">dashboard.py</text>
  <text x="880" y="966" font-family="Source Serif 4, serif" font-size="9.5" fill="#5D6862">Streamlit fallback —</text>
  <text x="880" y="979" font-family="Source Serif 4, serif" font-size="9.5" fill="#5D6862">imports the same layer</text>
  <rect x="1240" y="926" width="150" height="52" rx="2" fill="#E3EAF4" stroke="#35548C" stroke-width="1.4"/>
  <text x="1250" y="946" font-family="JetBrains Mono, monospace" font-size="10" font-weight="700" fill="#171B18">app/web/ · 4 pages</text>
  <text x="1250" y="961" font-family="Source Serif 4, serif" font-size="9.5" fill="#5D6862">summary · device · analysis</text>
  <text x="1250" y="974" font-family="Source Serif 4, serif" font-size="9.5" fill="#5D6862">· actuations — no CDN</text>
  <rect x="1440" y="926" width="150" height="52" rx="2" fill="#E3EAF4" stroke="#35548C" stroke-width="1.4"/>
  <text x="1450" y="946" font-family="JetBrains Mono, monospace" font-size="10" font-weight="700" fill="#171B18">agent.js</text>
  <text x="1450" y="961" font-family="Source Serif 4, serif" font-size="9.5" fill="#5D6862">SSE panel — steps</text>
  <text x="1450" y="974" font-family="Source Serif 4, serif" font-size="9.5" fill="#5D6862">appear as they happen</text>
